server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;

    # There is no index.html — this serves a versioned asset bundle, not a site.
    autoindex off;

    # The storefront loads these assets cross-origin, and webpack emits
    # subresource-integrity hashes (which force crossorigin="anonymous"), so
    # every response has to be CORS-readable or the browser drops it.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Timing-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        application/manifest+json
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # add_header in a location replaces inherited headers, so the CORS header is
    # repeated in each block below rather than inherited from the server scope.

    # Content-hashed bundles (checkout-1a2b3c4d.js) never change under one name.
    # The regex is quoted because nginx would otherwise read the `{8}` braces as
    # block delimiters and stop parsing the location mid-pattern.
    location ~* "-[0-9a-f]{8}\.(?:js|css|map)$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Timing-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Manifests and version-suffixed translations are the release entry points;
    # they change on every deploy, so keep them short-lived.
    location ~* ^/(?:manifest[^/]*\.json|translations-[^/]+\.js)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Timing-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
